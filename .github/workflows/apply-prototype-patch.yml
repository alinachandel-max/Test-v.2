name: Apply prototype patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-prototype-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply local prototype patch
        run: |
          python3 - <<'PYCODE'
          import base64
          import gzip
          import pathlib
          import subprocess

          data = """

          """
          patch_path = pathlib.Path("prototype-update.patch")
          patch_path.write_bytes(gzip.decompress(base64.b64decode(data)))
          subprocess.run(["git", "apply", "--binary", "--check", str(patch_path)], check=True)
          subprocess.run(["git", "apply", "--binary", str(patch_path)], check=True)
          patch_path.unlink(missing_ok=True)
          pathlib.Path(".github/workflows/apply-prototype-patch.yml").unlink(missing_ok=True)
          PYCODE
      - name: Commit applied prototype patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posting-flow-screen.html prototype-library/posting-flow-fixes.css prototype-library/posting-flow.js seller-cabinet-screen.html .github/workflows/apply-prototype-patch.yml
          git commit -m "Apply prototype publishing patch"
          git push
