<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BirBir Prototype</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }

    .prototype-app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f3f4f6;
    }

    .prototype-app__frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      pointer-events: none;
      background: #fff;
      transition: opacity 120ms ease;
    }

    .prototype-app__frame.is-active {
      z-index: 1;
      opacity: 1;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .prototype-app__frame {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="prototype-app" aria-label="BirBir clickable prototype">
    <iframe class="prototype-app__frame is-active" data-route="home" title="Главная" src="index.html?app=1&amp;v=20260705-single-link-v1"></iframe>
    <iframe class="prototype-app__frame" data-route="seller" title="Продажа" src="seller-cabinet-screen.html?single=1&amp;v=20260705-single-link-v1"></iframe>
    <iframe class="prototype-app__frame" data-route="profile" title="Профиль" src="profile-screen.html?single=1&amp;v=20260705-single-link-v1"></iframe>
  </main>

  <script>
    (function () {
      "use strict";

      var ROUTES = {
        "": "home",
        "index.html": "home",
        "birbir-home-screen-v2.html": "home",
        "seller-cabinet-screen.html": "seller",
        "profile-screen.html": "profile"
      };
      var ICONS = [
        ["badge--premium", "icon-crown-fill"],
        ["badge--urgent-sale", "icon-lightning-fill"],
        ["badge--business", "icon-check-circle-fill"],
        ["badge--delivery", "icon-track-fill"],
        ["badge--agency", "icon-agency-fill"],
        ["badge--close", "icon-close-circle-fill"],
        ["badge--push-up", "icon-up-ad-fill"]
      ];
      var activeRoute = "home";
      var frames = {};
      var SOURCES = {
        home: "index.html?app=1&v=20260705-single-link-v1",
        seller: "seller-cabinet-screen.html?single=1&v=20260705-single-link-v1",
        profile: "profile-screen.html?single=1&v=20260705-single-link-v1"
      };

      function getFileName(href, base) {
        try {
          var url = new URL(href, base || window.location.href);
          if (url.origin !== window.location.origin) {
            return "";
          }
          return url.pathname.split("/").pop() || "index.html";
        } catch (error) {
          return "";
        }
      }

      function getRoute(href, base) {
        return ROUTES[getFileName(href, base)] || "";
      }

      function setActiveRoute(route) {
        if (!route || !frames[route]) {
          return;
        }
        activeRoute = route;
        Object.keys(frames).forEach(function (key) {
          frames[key].classList.toggle("is-active", key === route);
          frames[key].setAttribute("aria-hidden", key === route ? "false" : "true");
        });
        wireFrame(frames[route]);
      }

      function handleRouteClick(event, doc) {
        var target = event.target;
        var link = target && target.closest ? target.closest("a[href]") : null;
        var route;
        if (!link || link.target && link.target !== "_self") {
          return;
        }
        route = getRoute(link.getAttribute("href"), doc.location.href);
        if (!route) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        setActiveRoute(route);
      }

      function iconForBadge(badge) {
        var found = "";
        ICONS.some(function (entry) {
          if (badge.classList.contains(entry[0])) {
            found = entry[1];
            return true;
          }
          return false;
        });
        return found;
      }

      function patchBadges(doc) {
        Array.prototype.forEach.call(doc.querySelectorAll(".badge .badge__icon"), function (icon) {
          var badge = icon.closest(".badge");
          var symbol = badge ? iconForBadge(badge) : "";
          var size = icon.classList.contains("badge__icon--10") ? 10 : 12;
          if (!symbol) {
            return;
          }
          icon.innerHTML = '<span class="icon-box icon-box--' + size + ' icon-color--on-dark" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><use href="#' + symbol + '"></use></svg></span>';
        });
      }

      function patchDocument(doc) {
        var homeToggle = doc.querySelector("[data-home-version-toggle]");
        if (homeToggle) {
          homeToggle.setAttribute("href", "index.html");
        }
        Array.prototype.forEach.call(doc.querySelectorAll(".status-bar__time"), function (node) {
          var statusBar = node.closest(".status-bar, .ios-status-bar, [class*='status-bar']");
          if (statusBar && statusBar.parentNode) {
            statusBar.parentNode.removeChild(statusBar);
          }
        });
        patchBadges(doc);
        patchSellerPosting(doc);
      }

      function closeSellerPosting(doc) {
        var embed = doc.querySelector("[data-seller-posting-embed]");
        if (!embed) {
          return;
        }
        embed.classList.remove("is-open");
        embed.hidden = true;
        embed.setAttribute("aria-hidden", "true");
        if (doc.body) {
          doc.body.classList.remove("seller-posting-modal-open");
        }
      }

      function patchPostingFrame(sellerDoc, postingFrame) {
        var postingDoc;
        try {
          postingDoc = postingFrame.contentDocument;
          if (!postingDoc || postingDoc.__birbirSingleLinkPostingWired) {
            return;
          }
          postingDoc.__birbirSingleLinkPostingWired = true;
          postingDoc.addEventListener("click", function (event) {
            var target = event.target;
            if (target && target.closest && target.closest(".posting-draft-link, [data-posting-close-success]")) {
              event.preventDefault();
              event.stopPropagation();
              closeSellerPosting(sellerDoc);
            }
          }, true);
        } catch (error) {
          return;
        }
      }

      function patchSellerPosting(doc) {
        var embed = doc.querySelector("[data-seller-posting-embed]");
        var postingFrame = doc.querySelector("[data-seller-posting-frame]");
        var frameWindow = doc.defaultView;
        if (!embed || !postingFrame) {
          return;
        }
        if (frameWindow && !frameWindow.__birbirSingleLinkPostingMessageWired) {
          frameWindow.__birbirSingleLinkPostingMessageWired = true;
          frameWindow.addEventListener("message", function (event) {
            if (event.data && event.data.type === "birbir-posting-close") {
              closeSellerPosting(doc);
            }
          });
        }
        if (!postingFrame.__birbirSingleLinkPostingLoadWired) {
          postingFrame.__birbirSingleLinkPostingLoadWired = true;
          postingFrame.addEventListener("load", function () {
            var loadedRoute = "";
            try {
              loadedRoute = getRoute(postingFrame.contentWindow.location.href, window.location.href);
            } catch (error) {
              loadedRoute = "";
            }
            if (loadedRoute === "seller") {
              closeSellerPosting(doc);
              postingFrame.src = "posting-flow-screen.html?embedded=1&v=20260705-single-link-v1";
              return;
            }
            patchPostingFrame(doc, postingFrame);
          });
        }
        patchPostingFrame(doc, postingFrame);
      }

      function wireFrame(frame) {
        var doc;
        try {
          doc = frame.contentDocument;
          if (!doc) {
            return;
          }
          if (!doc.__birbirSingleLinkWired) {
            doc.__birbirSingleLinkWired = true;
            doc.addEventListener("click", function (event) {
              handleRouteClick(event, doc);
            }, true);
          }
          patchDocument(doc);
          window.setTimeout(function () { patchDocument(doc); }, 250);
          window.setTimeout(function () { patchDocument(doc); }, 1000);
        } catch (error) {
          return;
        }
      }

      function syncFrameRoute(frame, route) {
        var loadedRoute = "";
        try {
          loadedRoute = getRoute(frame.contentWindow.location.href, window.location.href);
        } catch (error) {
          loadedRoute = "";
        }
        wireFrame(frame);
        if (loadedRoute && loadedRoute !== route && frames[loadedRoute]) {
          setActiveRoute(loadedRoute);
          if (!frame.__birbirSingleLinkRestoring && SOURCES[route]) {
            frame.__birbirSingleLinkRestoring = true;
            window.setTimeout(function () {
              frame.src = SOURCES[route];
              frame.__birbirSingleLinkRestoring = false;
            }, 0);
          }
        }
      }

      Array.prototype.forEach.call(document.querySelectorAll("[data-route]"), function (frame) {
        var route = frame.getAttribute("data-route");
        frames[route] = frame;
        frame.setAttribute("aria-hidden", route === activeRoute ? "false" : "true");
        frame.addEventListener("load", function () {
          syncFrameRoute(frame, route);
        });
        wireFrame(frame);
      });

      document.addEventListener("click", function (event) {
        handleRouteClick(event, document);
      }, true);
      window.setInterval(function () {
        Object.keys(frames).forEach(function (route) {
          wireFrame(frames[route]);
        });
      }, 300);
    }());
  </script>
</body>
</html>
